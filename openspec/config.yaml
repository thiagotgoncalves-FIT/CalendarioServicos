schema: spec-driven

context: |
  Project: AgendAí — Plataforma de Gestão e Agendamento para Prestadores Independentes.
  Academic: Projeto Integrador - Innovation Lab: Advanced No/Low Code (Faculdade IMPACTA - Prof. Leonardo Bontempo).
  Domain: Plataforma web de agendamento online e gestão para prestadores de serviços autônomos (barbeiros, personal trainers, manicures, tutores) e seus clientes.
  Core Value: Eliminar marcações manuais via WhatsApp, prevenir conflitos de agenda (double booking) e reduzir furos/no-shows com reserva em poucos cliques.
  Tech stack: Python 3.14, Streamlit, Xano (Backend / XanoScript), OpenSpec (SDD), Git/GitHub.
  Frontend: Streamlit é a tecnologia obrigatória para implementação das interfaces frontend do projeto. Não introduzir outra tecnologia de frontend sem uma mudança explícita da decisão arquitetural.
  Backend: Xano é a plataforma de backend, responsável pela modelagem de dados, regras de negócio (disponibilidade, horários, cálculo de slots, conflitos), autenticação JWT e disponibilização de APIs REST.
  Architecture: Backend no Xano responsável por regras de negócio e persistência. Frontend Streamlit consome endpoints Xano via HTTP. Frontend não deve ser considerado mecanismo de segurança exclusivo.
  Development: Toda nova funcionalidade deve obrigatoriamente seguir o ciclo Explore -> Propose -> Review -> Apply -> Archive antes de qualquer implementacao. Nenhum codigo e escrito sem artefatos aprovados pelo grupo.
  Language: Escrever os artefatos OpenSpec em português brasileiro.

rules:
  proposal:
    - Descrever claramente o problema, objetivo e escopo.
    - Identificar o que está fora do escopo quando necessário.
  specs:
    - Escrever requisitos verificáveis.
    - Utilizar cenários para comportamentos relevantes (sucesso e falha).
  tasks:
    - Dividir a implementação em tarefas pequenas, verticais e individualmente verificáveis.
    - Cada tarefa deve cobrir tanto o backend (Xano) quanto o frontend (Streamlit) quando aplicável.
    - Nunca criar tarefa para "criar o banco" de forma isolada; o banco evolui junto com a funcionalidade.

operations:
  apply:
    guidance:
      - Seguir estritamente o checklist tasks.md, marcando [x] conforme cada tarefa e concluida.
      - Interromper e consultar o grupo se surgir decisao que contradiga o dominio, altere a arquitetura ou expanda o escopo.
      - Executar verificacoes funcionais e testes antes de marcar a tarefa como concluida.
      - Nunca implementar funcionalidades fora do escopo da change atual sem aprovacao explicita.
  archive:
    guidance:
      - Confirmar que toda implementacao corresponde as especificacoes antes de arquivar.
      - Atualizar openspec/specs/ com o comportamento consolidado do que foi implementado.
      - Verificar que tasks.md esta com todas as tarefas marcadas [x] antes do archive.
